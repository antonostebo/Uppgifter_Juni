<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uppgiftslista</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #FFF9EC 0%, #EEF7FF 60%, #F0FFF4 100%);
    padding-bottom: 60px;
  }
  .header {
    background: linear-gradient(90deg, #4D96FF 0%, #6BCB77 100%);
    padding: 20px 24px 18px;
    text-align: center;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 4px 20px rgba(77,150,255,0.25);
    margin-bottom: 28px;
  }
  .header-emoji { font-size: 36px; margin-bottom: 4px; }
  .header h1 { color: #fff; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
  .header-sub { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 4px; font-weight: 600; }
  .container { max-width: 460px; margin: 0 auto; padding: 0 20px; }
  label.field-label {
    display: block; font-size: 13px; font-weight: 700;
    color: #888; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"] {
    width: 100%; padding: 12px 16px; border-radius: 14px;
    border: 1.5px solid #e0e8ff; font-size: 15px; font-weight: 600;
    outline: none; background: #fff; color: #333;
    font-family: 'Nunito', sans-serif;
    box-shadow: 0 2px 8px rgba(77,150,255,0.08);
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #4D96FF; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }
  .btn-add {
    background: linear-gradient(135deg, #4D96FF, #6BCB77);
    color: #fff; border: none; border-radius: 14px;
    width: 46px; font-size: 26px; font-weight: 800;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(77,150,255,0.3);
    transition: transform 0.1s;
  }
  .btn-add:active { transform: scale(0.93); }
  .section { margin-bottom: 20px; }
  .task-preview {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1.5px solid #e8f0fe;
  }
  .task-preview-icon { font-size: 18px; }
  .task-preview-text { flex: 1; font-size: 15px; font-weight: 600; color: #333; }
  .btn-remove {
    background: none; border: none; color: #ccc;
    font-size: 22px; cursor: pointer; line-height: 1;
    padding: 0 3px; transition: color 0.15s;
  }
  .btn-remove:hover { color: #FF6B6B; }
  .empty-hint { text-align: center; color: #bbb; font-size: 14px; font-weight: 600; padding: 20px 0 28px; }

  .btn-start {
    width: 100%; background: linear-gradient(90deg, #4D96FF, #6BCB77);
    color: #fff; border: none; border-radius: 99px; padding: 15px;
    font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 16px rgba(77,150,255,0.35);
    font-family: 'Nunito', sans-serif;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 12px;
  }
  .btn-start:disabled { background: #e0e0e0; color: #aaa; box-shadow: none; cursor: default; }
  .btn-start:not(:disabled):active { transform: scale(0.98); }

  .btn-share {
    width: 100%; background: #fff;
    color: #4D96FF; border: 2px solid #4D96FF; border-radius: 99px; padding: 13px;
    font-size: 15px; font-weight: 800; cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-share:disabled { border-color: #ddd; color: #bbb; cursor: default; }
  .btn-share:not(:disabled):hover { background: #EEF7FF; }
  .btn-share:not(:disabled):active { transform: scale(0.98); }

  /* Share modal */
  #share-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 700;
    align-items: center; justify-content: center; padding: 24px;
  }
  #share-overlay.show { display: flex; }
  .share-card {
    background: #fff; border-radius: 24px; padding: 32px 24px;
    max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .share-card h2 { font-size: 20px; font-weight: 800; color: #333; margin-bottom: 6px; }
  .share-card p { font-size: 14px; color: #888; font-weight: 600; margin-bottom: 18px; }
  .share-url-box {
    display: flex; gap: 8px; align-items: center;
    background: #f4f7ff; border-radius: 12px; padding: 10px 14px;
    margin-bottom: 18px; border: 1.5px solid #e0e8ff;
  }
  .share-url-text {
    flex: 1; font-size: 12px; color: #555; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: monospace;
  }
  .btn-copy {
    background: linear-gradient(135deg, #4D96FF, #6BCB77);
    color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; font-weight: 800;
    cursor: pointer; font-family: 'Nunito', sans-serif;
    white-space: nowrap; transition: transform 0.1s;
    flex-shrink: 0;
  }
  .btn-copy:active { transform: scale(0.95); }
  .share-actions { display: flex; flex-direction: column; gap: 8px; }
  .btn-share-via {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 14px; border: 1.5px solid #e8f0fe;
    background: #fff; cursor: pointer; font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 700; color: #333;
    transition: background 0.15s;
    text-decoration: none;
  }
  .btn-share-via:hover { background: #f4f7ff; }
  .btn-share-via-icon { font-size: 22px; width: 28px; text-align: center; }
  .btn-close-share {
    margin-top: 16px; width: 100%; background: none; border: 1.5px solid #ddd;
    border-radius: 99px; padding: 10px; color: #888;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .copy-feedback {
    text-align: center; font-size: 13px; font-weight: 700;
    color: #6BCB77; height: 18px; margin-top: -10px; margin-bottom: 10px;
    transition: opacity 0.3s;
  }

  /* Progress */
  .progress-wrap {
    background: #e8f0fe; border-radius: 99px; height: 18px;
    overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 100%; border-radius: 99px; width: 0%;
    background: linear-gradient(90deg, #4D96FF, #6BCB77);
    box-shadow: 0 2px 8px rgba(77,150,255,0.3);
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }
  .progress-bar.complete { background: linear-gradient(90deg, #6BCB77, #20C997); }
  .progress-label { text-align: right; font-size: 13px; color: #888; font-weight: 700; margin-bottom: 20px; }

  .task-item {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border-radius: 18px; padding: 15px 18px;
    margin-bottom: 10px; border: 1.5px solid #e8f0fe;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    transition: all 0.3s; user-select: none;
  }
  .task-item.done {
    background: linear-gradient(90deg, #f0fff4, #e8f8f5);
    border-color: #6BCB77; box-shadow: none; opacity: 0.75; cursor: default;
  }
  .check-circle {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid #cde; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.3s; background: transparent;
  }
  .task-item.done .check-circle {
    background: linear-gradient(135deg, #6BCB77, #20C997);
    border-color: transparent; color: #fff;
  }
  .task-item-text { flex: 1; font-size: 16px; font-weight: 700; color: #333; transition: all 0.3s; }
  .task-item.done .task-item-text { text-decoration: line-through; color: #6BCB77; }
  .task-item-emoji { font-size: 20px; }

  .btn-back {
    margin-top: 20px; background: none; border: 1.5px solid #ddd;
    border-radius: 99px; padding: 10px 22px; color: #888;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .btn-back:hover { border-color: #aaa; }

  #cheer-toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: linear-gradient(90deg, #4D96FF, #6BCB77);
    color: #fff; padding: 13px 28px; border-radius: 99px;
    font-size: 15px; font-weight: 800;
    opacity: 0; pointer-events: none; z-index: 500;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(77,150,255,0.4);
    font-family: 'Nunito', sans-serif;
    transition: opacity 0.35s, transform 0.35s cubic-bezier(.4,0,.2,1);
  }
  #cheer-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #victory-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 800;
    align-items: center; justify-content: center; padding: 24px;
  }
  #victory-overlay.show { display: flex; }
  .victory-card {
    background: #fff; border-radius: 28px; padding: 40px 32px;
    text-align: center; max-width: 340px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .victory-trophy { font-size: 64px; margin-bottom: 12px; }
  .victory-title { font-size: 24px; font-weight: 800; color: #333; margin-bottom: 8px; }
  .victory-msg { font-size: 16px; color: #888; margin-bottom: 6px; font-weight: 600; }
  .victory-sub { font-size: 14px; color: #aaa; margin-bottom: 28px; }
  .btn-newday {
    background: linear-gradient(90deg, #4D96FF, #6BCB77);
    color: #fff; border: none; border-radius: 99px;
    padding: 13px 32px; font-size: 16px; font-weight: 800;
    cursor: pointer; font-family: 'Nunito', sans-serif;
    box-shadow: 0 4px 16px rgba(77,150,255,0.35);
  }

  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="header">
  <div class="header-emoji">📋✨</div>
  <h1 id="header-title">Uppgiftslista</h1>
  <div class="header-sub" id="header-sub" style="display:none"></div>
</div>

<div class="container">

  <!-- SETUP VIEW -->
  <div id="setup-view">
    <div class="section">
      <label class="field-label">Barnets namn</label>
      <input type="text" id="name-input" placeholder="t.ex. Elsa" />
    </div>
    <div class="section">
      <label class="field-label">Lägg till uppgift</label>
      <div class="add-row">
        <input type="text" id="task-input" placeholder="t.ex. Borsta tänderna" />
        <button class="btn-add" onclick="addTask()" title="Lägg till">+</button>
      </div>
    </div>
    <div id="setup-list"></div>
    <button class="btn-start" id="start-btn" onclick="startDay()" disabled>🚀 Starta dagen!</button>
    <button class="btn-share" id="share-btn" onclick="openShare()" disabled>
      <span>🔗</span> Skapa delningslänk
    </button>
  </div>

  <!-- TRACKER VIEW -->
  <div id="tracker-view" style="display:none">
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-label" id="progress-label">0 av 0 klara</div>
    <div id="tracker-list"></div>
    <button class="btn-back" onclick="resetAll()">← Ändra uppgifter</button>
  </div>

</div>

<!-- Share modal -->
<div id="share-overlay">
  <div class="share-card">
    <h2>🔗 Dela listan</h2>
    <p>Skicka länken till barnet — uppgifterna är redan ifyllda!</p>
    <div class="share-url-box">
      <span class="share-url-text" id="share-url-text"></span>
      <button class="btn-copy" onclick="copyUrl()">Kopiera</button>
    </div>
    <div class="copy-feedback" id="copy-feedback"></div>
    <div class="share-actions">
      <a id="share-whatsapp" class="btn-share-via" href="#" target="_blank">
        <span class="btn-share-via-icon">💬</span> Dela via WhatsApp
      </a>
      <a id="share-sms" class="btn-share-via" href="#" target="_blank">
        <span class="btn-share-via-icon">📱</span> Dela via SMS
      </a>
      <a id="share-email" class="btn-share-via" href="#" target="_blank">
        <span class="btn-share-via-icon">✉️</span> Dela via e-post
      </a>
    </div>
    <button class="btn-close-share" onclick="closeShare()">Stäng</button>
  </div>
</div>

<!-- Cheer toast -->
<div id="cheer-toast"></div>

<!-- Victory overlay -->
<div id="victory-overlay">
  <div class="victory-card">
    <div class="victory-trophy">🏆</div>
    <div class="victory-title" id="victory-title"></div>
    <div class="victory-msg">Alla uppgifter är klara! 🎉</div>
    <div class="victory-sub">Du är en riktig stjärna idag!</div>
    <button class="btn-newday" onclick="resetAll()">🌅 Ny dag</button>
  </div>
</div>

<script>
const CHEERS = ["Bra jobbat! 🌟","Toppen! Du är grym! 💪","Wow, vad duktig du är! ⭐","Fortsätt så! Du klarar allt! 🚀","Fantastiskt gjort! 🎉","Jättebra! En till! 💫","Du är en stjärna! ✨","Superhjälte! 🦸"];
const EMOJIS = ["⭐","🌟","💪","🚀","🎯","✏️","🧹","📚","🦷","🥣"];
const CONFETTI_COLORS = ["#FF6B6B","#FFD93D","#6BCB77","#4D96FF","#FF922B","#CC5DE8","#20C997","#F06595"];

let tasks = [];
let childName = "";
let cheerTimer = null;

// --- Read URL params on load ---
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get('d');
  if (encoded) {
    try {
      const data = JSON.parse(atob(encoded));
      childName = data.name || '';
      tasks = (data.tasks || []).map((t, i) => ({ id: i + 1, text: t, done: false }));
      document.getElementById('name-input').value = childName;
      renderSetup();
      // Auto-start directly into tracker
      startDay();
    } catch(e) { /* ignore bad params */ }
  } else {
    renderSetup();
  }
});

document.getElementById('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('task-input').focus(); });

function addTask() {
  const inp = document.getElementById('task-input');
  const val = inp.value.trim();
  if (!val) return;
  tasks.push({ id: Date.now(), text: val, done: false });
  inp.value = '';
  renderSetup();
  inp.focus();
}

function removeTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  renderSetup();
}

function renderSetup() {
  const el = document.getElementById('setup-list');
  const hasTasks = tasks.length > 0;
  document.getElementById('start-btn').disabled = !hasTask();
  document.getElementById('share-btn').disabled = !hasTask();
  if (!hasTask()) {
    el.innerHTML = '<p class="empty-hint">Inga uppgifter ännu — lägg till några! 👆</p>';
    return;
  }
  el.innerHTML = tasks.map((t, i) => `
    <div class="task-preview">
      <span class="task-preview-icon">${EMOJIS[i % EMOJIS.length]}</span>
      <span class="task-preview-text">${escHtml(t.text)}</span>
      <button class="btn-remove" onclick="removeTask(${t.id})" title="Ta bort">×</button>
    </div>
  `).join('');
}

function hasTask() { return tasks.length > 0; }

function startDay() {
  if (!hasTask()) return;
  const nameVal = document.getElementById('name-input').value.trim();
  if (nameVal) childName = nameVal;
  if (!childName) childName = 'Lille vän';
  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('tracker-view').style.display = 'block';
  document.getElementById('header-title').textContent = childName + 's uppgifter';
  document.getElementById('header-sub').style.display = 'block';
  renderTracker();
}

// --- Share ---
function buildShareUrl() {
  const name = document.getElementById('name-input').value.trim() || childName || 'Lille vän';
  const payload = { name, tasks: tasks.map(t => t.text) };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const base = window.location.href.split('?')[0];
  return base + '?d=' + encoded;
}

function openShare() {
  if (!hasTask()) return;
  const url = buildShareUrl();
  document.getElementById('share-url-text').textContent = url;
  const msg = encodeURIComponent('Här är din uppgiftslista för idag! 📋✨ ' + url);
  const name = document.getElementById('name-input').value.trim() || 'Lille vän';
  const subject = encodeURIComponent('Uppgifter för ' + name + ' idag!');
  document.getElementById('share-whatsapp').href = 'https://wa.me/?text=' + msg;
  document.getElementById('share-sms').href = 'sms:?body=' + msg;
  document.getElementById('share-email').href = 'mailto:?subject=' + subject + '&body=' + msg;
  document.getElementById('copy-feedback').textContent = '';
  document.getElementById('share-overlay').classList.add('show');
}

function closeShare() {
  document.getElementById('share-overlay').classList.remove('show');
}

function copyUrl() {
  const url = buildShareUrl();
  const fb = document.getElementById('copy-feedback');

  // Try modern clipboard API first (works on HTTPS / localhost)
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => {
      fb.textContent = '✓ Kopierad till urklipp!';
      setTimeout(() => { fb.textContent = ''; }, 2500);
    }).catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}

function fallbackCopy(text) {
  const fb = document.getElementById('copy-feedback');
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    const ok = document.execCommand('copy');
    fb.textContent = ok ? '✓ Kopierad till urklipp!' : 'Markera texten ovan och kopiera manuellt';
  } catch(e) {
    fb.textContent = 'Markera texten ovan och kopiera manuellt';
  }
  document.body.removeChild(ta);
  setTimeout(() => { fb.textContent = ''; }, 2500);
}

// --- Tracker ---
function renderTracker() {
  const list = document.getElementById('tracker-list');
  list.innerHTML = tasks.map((t, i) => `
    <div class="task-item${t.done ? ' done' : ''}" id="task-${t.id}" onclick="toggleTask(${t.id})">
      <div class="check-circle">${t.done ? '✓' : ''}</div>
      <span class="task-item-text">${escHtml(t.text)}</span>
      <span class="task-item-emoji">${t.done ? '🌟' : EMOJIS[i % EMOJIS.length]}</span>
    </div>
  `).join('');
  updateProgress();
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t || t.done) return;
  t.done = true;
  const el = document.getElementById('task-' + id);
  el.classList.add('done');
  el.querySelector('.check-circle').textContent = '✓';
  el.querySelector('.task-item-emoji').textContent = '🌟';
  el.onclick = null;
  updateProgress();
  triggerCheer();
  if (tasks.filter(t => t.done).length === tasks.length) setTimeout(showVictory, 650);
}

function updateProgress() {
  const done = tasks.filter(t => t.done).length;
  const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
  const bar = document.getElementById('progress-bar');
  bar.style.width = pct + '%';
  if (pct === 100) bar.classList.add('complete');
  document.getElementById('progress-label').textContent = done + ' av ' + tasks.length + ' klara';
  document.getElementById('header-sub').textContent = done + ' av ' + tasks.length + ' klara!';
}

function triggerCheer() {
  const toast = document.getElementById('cheer-toast');
  toast.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  toast.classList.add('show');
  clearTimeout(cheerTimer);
  cheerTimer = setTimeout(() => toast.classList.remove('show'), 2300);
}

function showVictory() {
  document.getElementById('victory-title').textContent = 'Bra jobbat, ' + childName + '!';
  document.getElementById('victory-overlay').classList.add('show');
  launchConfetti();
}

function resetAll() {
  tasks = []; childName = '';
  stopConfetti();
  document.getElementById('victory-overlay').classList.remove('show');
  document.getElementById('tracker-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
  document.getElementById('header-title').textContent = 'Uppgiftslista';
  document.getElementById('header-sub').style.display = 'none';
  document.getElementById('name-input').value = '';
  document.getElementById('progress-bar').classList.remove('complete');
  // Clear URL params
  history.replaceState(null, '', window.location.pathname);
  renderSetup();
}

// --- Confetti ---
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let particles = [], animId = null;

function launchConfetti() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  particles = Array.from({ length: 180 }, () => ({
    x: Math.random() * canvas.width, y: -20 - Math.random() * 200,
    w: 9 + Math.random() * 7, h: 5 + Math.random() * 5,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.14,
    vx: (Math.random() - 0.5) * 3.5, vy: 2.5 + Math.random() * 2.5, alpha: 1,
  }));
  drawConfetti();
}

function drawConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed;
    if (p.y > canvas.height * 0.65) p.alpha -= 0.018;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  particles = particles.filter(p => p.alpha > 0);
  if (particles.length > 0) animId = requestAnimationFrame(drawConfetti);
  else ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function stopConfetti() {
  cancelAnimationFrame(animId);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = [];
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
